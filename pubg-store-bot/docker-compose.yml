services:
  postgres:
    image: postgres:16-alpine
    container_name: pubg-store-postgres
    environment:
      POSTGRES_USER: pubg
      POSTGRES_PASSWORD: pubg
      POSTGRES_DB: pubg_store
    ports:
    - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubg -d pubg_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pubg-store-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    container_name: pubg-store-bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pubg:pubg@postgres:5432/pubg_store?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3780:3780"
    restart: unless-stopped
    profiles: ["app"]

volumes:
  pgdata:
  redisdata:
